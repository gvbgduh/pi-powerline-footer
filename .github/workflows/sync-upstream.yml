name: Sync Upstream

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Sync with upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream changes
        run: |
          git remote add upstream https://github.com/nicobailon/pi-powerline-footer.git
          git fetch upstream main

      - name: Rebase on upstream/main
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD upstream/main)
          
          if [ "$UPSTREAM_HEAD" = "$MERGE_BASE" ]; then
            echo "Already up to date with upstream/main."
            exit 0
          fi
          
          echo "New upstream commits detected. Rebasing..."
          if ! git rebase upstream/main; then
            echo "::error::Merge conflict detected while rebasing on upstream/main. Manual resolution required."
            git rebase --abort
            exit 1
          fi

      - name: Push rebased main
        run: |
          git push origin main --force-with-lease
